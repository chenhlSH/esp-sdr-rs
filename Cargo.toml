[workspace]
resolver = "3"
members = [
    "firmware/esp-sdr-mmio",
    "firmware/esp-sdr-radio",
    "firmware/apps",
    "host",
    "shared",
]
# default-members 只含能在主机上直接构建/测试的成员；
# 固件成员用 `cargo build -p <pkg> --target riscv32imac-unknown-none-elf` 显式构建。
default-members = ["host", "shared"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
defmt = "1.1"
edge-dhcp = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
# 与 esp-hal 1.2.2 内部使用的 PAC 版本对齐（0.3），避免类型分裂
esp32c5 = "0.3.0"
esp-alloc = "0.11.0"
esp-backtrace = "0.20.0"
esp-bootloader-esp-idf = "0.6.0"
esp-hal = { version = "1.2.2", features = ["defmt", "unstable"] }
esp-println = "0.18.0"
# esp-radio 1.0.0-beta.1 与 esp-hal 1.2.2 / esp-rtos 0.4.0 为同期配套发布；
# 0.18.0 需要 esp-hal ~1.1，与 esp-rtos 0.4 互斥，故不用。
esp-radio = { version = "=1.0.0-beta.1", features = ["esp-alloc", "unstable", "sniffer"] }
# raw 802.11 帧发射（esp_wifi_80211_tx）；必须与 esp-radio 内部依赖
# 同一版本（0.3.0），否则符号/类型分裂
esp-wifi-sys-esp32c5 = "0.3.0"
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-radio"] }
nb = "1.1"
static_cell = "2.1.0"

[profile.release]
debug = true
debug-assertions = true
lto = "fat"
codegen-units = 1

# vendor blob 的运行时胶水代码需要优化等级 2/3 才能正确工作（esp-radio 文档）。
[profile.dev.package.esp-radio]
opt-level = 3
