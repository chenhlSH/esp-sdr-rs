[package]
name = "esp-sdr-apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
defmt.workspace = true
edge-dhcp.workspace = true
edge-nal.workspace = true
edge-nal-embassy.workspace = true
embassy-executor.workspace = true
embassy-net.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
embedded-io.workspace = true
embedded-io-async.workspace = true
esp-alloc.workspace = true
esp-backtrace = { workspace = true, features = ["panic-handler", "defmt"] }
esp-bootloader-esp-idf.workspace = true
esp-hal.workspace = true
esp-println = { workspace = true, features = ["defmt-espflash"] }
esp-radio.workspace = true
esp-rtos.workspace = true
esp-sdr-mmio = { path = "../esp-sdr-mmio" }
esp-sdr-radio = { path = "../esp-sdr-radio" }
esp-sdr-shared = { path = "../../shared" }
# raw 802.11 帧发射（txwifi）；与 esp-radio 内部同一 0.3.0 crate，符号共享
esp-wifi-sys-esp32c5.workspace = true
esp32c5 = { workspace = true }
nb.workspace = true
static_cell.workspace = true

# 目标芯片在构建期钉死为 ESP32-C5（workspace 唯一目标板）。
[features]
default = ["esp32c5"]
esp32c5 = [
    "esp-backtrace/esp32c5",
    "esp-println/esp32c5",
    "esp-bootloader-esp-idf/esp32c5",
    "esp-rtos/esp32c5",
    "esp-hal/esp32c5",
    "esp-radio/esp32c5",
    "esp-radio/wifi",
    "esp-sdr-mmio/esp32c5",
]
